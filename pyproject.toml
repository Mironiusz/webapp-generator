[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generator"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit[toml]==1.9.4",
    "deptry==0.25.1",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "vulture==2.16",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py313"
line-length = 200
src = ["."]
cache-dir = ".cache/ruff"
exclude = [
    ".venv",
    "venv",
    ".git",
    ".cache",
    "__pycache__",
    "build",
    "dist",
    "template_packs",
    "TEMP",
]
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "C90",
    "A",
    "N",
    "RUF",
    "G",
    "ARG",
    "ASYNC",
    "DTZ",
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
files = ["config", "core", "main.py", "tests"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
cache_dir = ".cache/mypy"
strict = true

[tool.vulture]
paths = ["config", "core", "main.py", "tests"]
ignore_decorators = ["@pytest.fixture"]

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = ["template_packs", "TEMP"]

[tool.coverage.run]
data_file = ".cache/coverage"
source = ["config", "core"]

[tool.pytest.ini_options]
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"
filterwarnings = ["error"]
