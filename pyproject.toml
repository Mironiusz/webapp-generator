[tool.ruff]
target-version = "py312"
line-length = 200
src = ["."]

[tool.ruff.lint]
select = [
	"E4",
	"E7",
	"E9",
	"F",
	"I",
	"B",
	"UP",
	"SIM",
	"C4",
	"A",
	"N",
	"RUF",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
