[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
    "uvicorn==0.52.1",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.10.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py313"
line-length = 200
src = ["."]
cache-dir = ".cache/ruff"
exclude = [
    ".venv",
    "venv",
    ".git",
    ".cache",
    "__pycache__",
    "build",
    "dist",
]
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "C90",
    "A",
    "N",
    "RUF",
    "G",
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
files = ["main.py", "src"]
cache_dir = ".cache/mypy"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"
