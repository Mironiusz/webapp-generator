x-backend-runtime: &backend-runtime
    build: .
    image: backend:local
    env_file:
        - .env
        - .env.local
    environment:
        DATABASE__URL: sqlite+aiosqlite:////var/lib/backend/app.db
        LOG__FILE_PATH: /var/log/backend/backend.log
    volumes:
        - backend-data:/var/lib/backend

services:
    migrate:
        <<: *backend-runtime
        command: ["python", "-m", "alembic", "upgrade", "head"]

    backend:
        <<: *backend-runtime
        depends_on:
            migrate:
                condition: service_completed_successfully
        ports:
            - 127.0.0.1:8000:8000
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 15s
            start_interval: 1s

volumes:
    backend-data:
